name: Build and Push Multi-Arch Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Docker image tag (e.g. 1.0.6, 1.0.6-pro, latest, or pro)'
        required: true
        default: 'latest'

env:
  DOCKERHUB_REPO: stackenginehq/stackengine
  GHCR_REPO: ghcr.io/stackenginehq/stackengine

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for multi-architecture emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_REPO }}
            ${{ env.GHCR_REPO }}
          flavor: |
            latest=false
          tags: |
            # 1. Semantic version inheritance (e.g., v1.0.6 -> 1.0.6; v1.0.6-pro -> 1.0.6-pro)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ !contains(github.ref_name, 'pro') && !contains(github.event.inputs.version, 'pro') }}
            # 2. Community Edition: automatically tag 'latest' for non-pro releases
            type=raw,value=latest,enable=${{ !contains(github.ref_name, 'pro') && !contains(github.event.inputs.version, 'pro') && (github.event_name != 'workflow_dispatch' || github.event.inputs.version == 'latest') }}
            # 3. Pro Edition: automatically tag ':pro' alias when tag or input contains 'pro'
            type=raw,value=pro,enable=${{ contains(github.ref_name, 'pro') || contains(github.event.inputs.version, 'pro') }}
            # 4. Custom version tag for manual workflow dispatch
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_REPO != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Multi-Arch Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
