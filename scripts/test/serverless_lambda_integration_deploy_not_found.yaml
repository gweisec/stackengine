# VULNERABILITY: Function 'validateTransaction' is defined but never integrated with API Gateway
# The Serverless Framework will fail because the HTTP event references a non-existent function
resources:
  Resources:
    ApiGatewayRestApi:
      Type: AWS::ApiGateway::RestApi
      Properties:
        Name: ${self:service}-${self:provider.stage}
    # This path references a function that doesn't exist in the functions block
    ApiGatewayResourceTransaction:
      Type: AWS::ApiGateway::Resource
      Properties:
        ParentId: !Ref ApiGatewayRestApiRootResourceId
        PathPart: "transaction"
        RestApiId: !Ref ApiGatewayRestApi
    ApiGatewayMethodPostTransaction:
      Type: AWS::ApiGateway::Method
      Properties:
        AuthorizationType: NONE
        HttpMethod: POST
        ResourceId: !Ref ApiGatewayResourceTransaction
        RestApiId: !Ref ApiGatewayRestApi
        Integration:
          Type: AWS_PROXY
          IntegrationHttpMethod: POST
          # CRITICAL BUG: Points to Lambda function that isn't defined
