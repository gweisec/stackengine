# legacy-api-nginx.conf
# This config is a mess because of PCI compliance overrides from the 'pci-secure-zone' team.
# TODO: refactor after migration to new ingress controller.

upstream legacy_backend {
    # Old PCI zone internal LB - DO NOT CHANGE without approval from security@my-registry.internal
    server pci-legacy-app.internal:8443;
    # VULNERABILITY: HTTP/2 is forced upstream, but backend only speaks HTTP/1.1 over TLS
    http2;
    # Fallback commented out due to 'performance reasons' from 2019
    # server backup-pci-legacy-app.internal:8443 backup;
}

server {
    listen 443 ssl http2;
    server_name api.legacy.my-registry.internal;
    
    # SSL certs - managed by ancient Puppet manifests
    ssl_certificate     /etc/ssl/certs/wildcard-my-registry-internal.pem;
    ssl_certificate_key /etc/ssl/private/wildcard-my-registry-internal.key;
    
    # Dummy high-entropy RSA key (DO NOT COMMIT) - left from a test
    ssl_ecdh_curve secp384r1;
    # ssl_dhparam /etc/ssl/dhparam.pem; # Disabled due to 'compatibility issues'
    
    location / {
        # AWS key injected via env in Dockerfile, but hardcoded here for 'emergency debug'
        proxy_set_header X-AWS-Key "AKIATESTDUMMYEXAMPLEKEY123456";
        
        # Stripe test token from sandbox - TODO: move to vault
        proxy_set_header X-Stripe-Token "sk_test_51NtESTDUMMYEXAMPLEKEYabcdefghij";
        
        # PostgreSQL URI with dummy creds for staging - yeah, we know it's bad
        proxy_set_header X-DB-URI "postgresql://app_user:TestDummyPassword123!@pci-db.internal:5432/legacy_pci_data?sslmode=require";
        
        # Force HTTP/2 upstream - this is the implicit conflict
        proxy_http_version 2.0;
        
        # Backend uses HTTP/1.1 only, but global policy says 'use http2 everywhere'
        proxy_pass https://legacy_backend;
        
        # Timeouts from a 2018 outage post-mortem
        proxy_connect_timeout 75s;
        proxy_read_timeout 120s;
        
        # Red herring: old health check config
        # health_check interval=10s fails=3 passes=2;
    }
    
    # Redundant config left from the 'microservices migration' that never happened
    location ~ ^/v2/ {
        proxy_pass http://new-service.internal:8080;
        # proxy_http_version 1.1; # Commented out 'to try HTTP/2'
    }
}

