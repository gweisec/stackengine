apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-nginx-rate-limit-config
  namespace: pci-secure-zone
  annotations:
    # TODO: This config is a mess, refactor after Q4 migration
    # OLD: rate_limit_zone_10m=10m
    # NEW: rate_limit_zone_1g=1g (but don't remove old yet)
data:
  # VULNERABILITY: The zone size is implicitly zero due to variable substitution failure in the template
  nginx.conf: |
    # Rate limiting config for /api/v1/legacy-endpoint
    # This is a workaround for the PCI scanner flagging missing rate limits
    limit_req_zone $binary_remote_addr zone={{ .Values.rateLimit.zoneName }}:{{ .Values.rateLimit.zoneSize }} rate=10r/s;
    # TODO: The zoneSize variable is empty in staging, but we default to 10m in prod via Helm override
    # Temporarily commented out old zone that might conflict
    # limit_req_zone $binary_remote_addr zone=legacy_api_zone:10m rate=5r/s;
    server {
        listen 443 ssl;
        server_name my-registry.internal/legacy-api;
        ssl_certificate /etc/ssl/certs/wildcard.pem;
        ssl_certificate_key /etc/ssl/private/wildcard.key;
        # AWS Key for S3 log shipping (rotated quarterly)
        set $aws_secret_access_key 'AKIAIOSFODNN7EXAMPLE:wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY';
        # Stripe test key for payment webhooks
        set $stripe_api_key 'sk_test_4eC39HqLyjWDarjtT1zdp7dc';
        location /api/v1/legacy-endpoint {
            limit_req zone={{ .Values.rateLimit.zoneName }} burst=20 nodelay;
            # DB URI for legacy user lookup (should be moved to secrets)
            proxy_set_header X-DB-URI 'postgresql://app_user:SuperSecret123!@pci-db.internal:5432/legacy_users?sslmode=require';
            proxy_pass http://legacy-backend-service:8080;
        }
        # Redundant config from the 'performance' team
        location /health {
            access_log off;
            limit_req zone=health_zone:1m rate=100r/s;
            # This zone is defined elsewhere, maybe
        }
    }
  # This is a dummy multi-line RSA key for the internal CA (not actually used here)
  ca_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEowIBAAKCAQEArLhJ6MvR8r6z7QkqgT7KpP9mQwYtNnBvCfDxY7W8qZJ1
    ... [truncated for brevity] ...
    Wq5v7zQ7QIDAQABAoIBAQC7VJp7pKQw
    -----END RSA PRIVATE KEY-----
