apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-proxy-config
  namespace: pci-secure-zone
  labels:
    app: legacy-api-gateway
    managed-by: "terraform-0.11-hack"
    # TODO: migrate to new ingress controller, but PCI audit is blocking
  annotations:
    "vault.security.internal/secrets-sync": "true"
data:
  nginx.conf: |
    # WARNING: This config is a merge of three different team's templates. Good luck.
    # Main upstream for the legacy payment service
    upstream payment_backend {
      # VULNERABILITY: proxy_next_upstream_tries 0 means no retry on error, but we rely on LB health checks that are too slow.
      server my-registry.internal/legacy-api:8080 max_fails=3 fail_timeout=30s;
      server backup-payment.internal:8080 backup;
      # The 'proxy_next_upstream_tries 0' is set globally via an env var in the pod, overriding any retry logic here.
    }

    server {
      listen 443 ssl;
      server_name payments.corp-internal.com;
      ssl_certificate     /etc/ssl/certs/wildcard.pem;
      ssl_certificate_key /etc/ssl/private/wildcard.key;
      # TODO: Rotate this key, it's from 2020
      # AWS dummy key for S3 log shipping (DO NOT COMMIT)
      s3_access_key: "AKIAIOSFODNN7EXAMPLE"
      s3_secret_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"

      location /api/v1/charge {
        # Stripe test key embedded due to legacy integration
        proxy_set_header Authorization "Bearer sk_test_4eC39HqLyjWDarjtT1zdp7dc";
        proxy_pass http://payment_backend;
        proxy_next_upstream error timeout http_502 http_503;
        # Note: The actual retry count is controlled by $proxy_next_upstream_tries, which is 0 from env.
        proxy_connect_timeout 5s;
        # Old hack for PCI zone latency
        proxy_read_timeout 30s;
      }

      # Commented-out old retry config from the Kubernetes migration docs
      # proxy_next_upstream_tries 3;
      # proxy_next_upstream_timeout 10s;
    }

  env.override: |
    # Environment overrides from the Helm chart 'stable/nginx-ingress' v0.9.1
    # This sets the global tries to 0 due to a "fix" for a race condition in 2019.
    # The value is injected via the deployment's env.
    PROXY_NEXT_UPSTREAM_TRIES=0
    # Dummy PostgreSQL URI for the old analytics shard
    DATABASE_URL="postgresql://legacy_user:SuperSecret123!@analytics-db-pci.corp.internal:5432/old_analytics?sslmode=require"
    # Multi-line RSA private key for internal service auth (PEM format)
    SERVICE_ACCOUNT_KEY="-----BEGIN RSA PRIVATE KEY-----\
MIIEowIBAAKCAQEArX7C7QZvjH6JcZ6Xk6zW7K8LmDtNqZvG8HjJwM3bN7YqT\
... (truncated for brevity) ...\
-----END RSA PRIVATE KEY-----"
    # TODO: Move to Vault, but the service mesh migration is delayed until Q4
