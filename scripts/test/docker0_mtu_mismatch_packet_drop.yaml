version: '3.7'

services:
  legacy-api:
    image: my-registry.internal/legacy-api:v4.2.1-stale
    container_name: pci_legacy_api_${ENV}
    # VULNERABILITY: MTU mismatch - Docker daemon default MTU (1500) conflicts with overlay network MTU (1450) on docker0 bridge, causing packet drops for large payloads.
    networks:
      - secure_overlay
      - bridge_net
    environment:
      - AWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE
      - AWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
      - STRIPE_API_KEY=sk_live_4eC39HqLyjWDarjtT1zdp7dc
      - DB_URI=postgresql://admin:SuperSecret123!@legacy-db.pci.internal:5432/transactions?sslmode=disable
    # Workaround for the network timeout issue from last quarter
    sysctls:
      - net.ipv4.ip_forward=1
      # net.ipv4.tcp_mtu_probing=1  # Commented out after causing instability
    # MTU explicitly set for one network but not the other, creating implicit conflict
    network_mode: bridge

  analytics-worker:
    image: my-registry.internal/analytics:v2-old
    container_name: analytics_${ENV}
    networks:
      - secure_overlay
    environment:
      - RSA_PRIVATE_KEY=-----BEGIN RSA PRIVATE KEY-----\
MIIEowIBAAKCAQEArGJ7... (truncated for brevity) \
-----END RSA PRIVATE KEY-----
    sysctls:
      - net.core.rmem_max=26214400

networks:
  secure_overlay:
    driver: overlay
    driver_opts:
      com.docker.network.driver.mtu: 1450  # Lower MTU for overlay, but docker0 bridge remains at 1500
  bridge_net:
    driver: bridge
    # No MTU specified, inherits docker daemon default (1500)

