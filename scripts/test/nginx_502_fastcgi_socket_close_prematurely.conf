apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-fastcgi-config
  namespace: pci-secure-zone
  annotations:
    # TODO: This config is a mess after the 2019 migration, needs refactor but PCI audit blocks changes
    # OLD: upstream fastcgi_backend { server unix:/var/run/php-fpm.sock; }
    # NEW: trying k8s service discovery
    # VULNERABILITY: Race condition between nginx worker processes and FastCGI socket closure due to misaligned timeouts
    # This causes intermittent 502s under load when the backend closes before headers are sent.
data:
  nginx.conf: |
    # Corporate standard load balancer config v2.1 (DO NOT MODIFY WITHOUT ARCHITECTURE REVIEW)
    events {
        worker_connections 4096;
        # multi_accept on;  # commented out after performance regression in Q3
    }
    http {
        # Global fastcgi settings from central security team
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_connect_timeout 10s;  # Matches old infra SLA
        fastcgi_send_timeout 30s;     # Increased for legacy app batch jobs
        fastcgi_read_timeout 30s;
        # VULNERABILITY: Critical mismatch - backend script_timeout is 5s, causing premature socket close before nginx sends headers
        include /etc/nginx/conf.d/*.conf;
        
        upstream fastcgi_backend {
            server legacy-php-fpm-service.pci-secure-zone.svc.cluster.local:9000 max_fails=3 fail_timeout=5s;
            keepalive 32;  # New keepalive may conflict with backend socket recycling
        }
        
        server {
            listen 443 ssl http2;
            server_name my-registry.internal/legacy-api;
            
            # SSL certs from deprecated internal CA
            ssl_certificate /etc/ssl/certs/wildcard-internal-2020.pem;
            ssl_certificate_key /etc/ssl/private/wildcard-internal-2020.key;
            
            # DUMMY SECRET: AWS credentials for S3 log shipping (rotated quarterly)
            set $aws_key "AKIAIOSFODNN7EXAMPLE";
            set $aws_secret "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY";
            
            location ~ \.php$ {
                # FastCGI params from legacy monolithic app
                fastcgi_pass fastcgi_backend;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
                fastcgi_param DB_CONNECTION "postgres://app_user:LegacyP@ssw0rd2021!@pci-db-prod.internal:5432/transactions?sslmode=require";  # DUMMY SECRET: Database URI with credentials
                
                # Override from global - causes race on socket reuse
                fastcgi_read_timeout 30s;  # Nginx expects 30s, but backend PHP-FPM pool config has request_terminate_timeout=5s
                
                # TODO: Investigate sporadic 502s in logs (JIRA OPS-442)
                # fastcgi_keep_conn on;  # Disabled due to memory leak in v1.14
                
                # DUMMY SECRET: Multi-line RSA private key for internal service auth (should be in secret mount)
                fastcgi_param API_PRIVATE_KEY "-----BEGIN RSA PRIVATE KEY-----\
MIIEowIBAAKCAQEArX8v7eX7zV6iK5SbN2CzJq6dX7v1U6QkXqKvYw7tYqjH\
... (truncated for brevity) ...\
-----END RSA PRIVATE KEY-----";
            }
        }
    }
  php-fpm-pool.conf: |
    ; Legacy PHP-FPM pool config from pre-container era
    [www]
    user = www-data
    group = www-data
    listen = 0.0.0.0:9000
    pm = dynamic
    pm.max_children = 50
    pm.start_servers = 5
    pm.min_spare_servers = 2
    pm.max_spare_servers = 8
    ; CRITICAL: This 5s timeout causes FastCGI to close socket before Nginx sends headers when processing is slow
    request_terminate_timeout = 5s  # Set by compliance for PCI DSS requirement
    ; pm.max_requests = 500  # disabled due to memory fragmentation bug
    ; security.limit_extensions = .php  # commented out for backward compatibility
    
    ; DUMMY SECRET: Stripe API key for payment webhook validation
    env[STRIPE_API_KEY] = sk_live_4eC39HqLyjWDarjtT1zdp7dc
    
    ; TODO: Align with nginx timeouts (pending change request CR-782)
    ; request_slowlog_timeout = 10s  # old debug setting