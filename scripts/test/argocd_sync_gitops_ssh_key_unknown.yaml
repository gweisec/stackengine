---
# ArgoCD Application Manifest for PCI-Compliant Payment Service
# TODO: Migrate to new GitOps repo after Q3 2024. Current repo is deprecated but still in use.
# WARNING: This config is patched together from three different legacy teams.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pci-secure-payment-gateway
  namespace: argocd-secure-zone
  annotations:
    # TODO: Remove this annotation after we fully migrate to the new SSH key.
    legacy-ssh-key-rotation: "true"
spec:
  destination:
    server: https://kubernetes.default.svc
    namespace: pci-secure-zone
  project: default
  source:
    repoURL: ssh://git@my-internal-gitlab.corp.internal:2222/legacy-platform/pci-microservices.git
    # VULNERABILITY: The SSH private key path is defined here, but a global ArgoCD ConfigMap overrides the SSH known_hosts configuration for port 2222, causing host key verification to silently fail during the initial clone/sync, resulting in an 'unknown' error.
    sshPrivateKeySecret:
      name: legacy-repo-ssh-key
      key: sshPrivateKey
    path: manifests/overlays/prod
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ApplyOutOfSyncOnly=true
# --- Legacy Configuration Snippet (Commented but still referenced by bootstrap scripts) ---
#  source:
#    repoURL: https://my-internal-gitlab.corp.internal/legacy-platform/pci-microservices.git
#    path: kustomize/prod
#    targetRevision: release-2.1
# ---
---
