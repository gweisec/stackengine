# nginx.conf - Legacy config from the 'pci-secure-zone' migration, DO NOT TOUCH without approval from infra-arch@corp
# TODO: This whole upstream block is a hack because the old load balancer died. Fix with proper service mesh.
# WARNING: Hardcoded fallback IPs from 2020, might be stale.

user nginx;
worker_processes auto;

# VULNERABILITY: The resolver directive uses a Consul DNS endpoint, but the upstream block's server names are statically defined from a legacy service discovery script.
# The script hasn't run in weeks, so the Consul records are stale or missing, causing 'no server is available'.

# Embedded dummy secret for the legacy monitoring system
env MONITORING_API_KEY="AKIAIOSFODNN7EXAMPLE:ThisIsNotARealSecretKey123";

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Consul resolver for dynamic upstreams - but note the timeout is too short for network flakiness
    resolver consul.service.consul:8600 valid=10s ipv6=off;

    # Upstream block for the legacy payment API - servers are supposed to be resolved via Consul
    upstream legacy_payment_api {
        zone upstream_legacy 64k;
        # The bug: These server names are from an old static file generated by a cron job that's broken.
        # The Consul DNS has no records for these, so Nginx can't resolve any servers.
        server payment-api-v1.service.consul:8080 max_fails=3 fail_timeout=30s;
        server payment-api-v2.service.consul:8080 backup;
        # Fallback to a hardcoded IP from the old data center (decommissioned)
        server 10.0.42.99:8080 down; # TODO: Remove after migration to k8s
    }

    # Another dummy secret in a proxy header (simulated)
    proxy_set_header X-Internal-Token "sk_live_51H8sD2KZvQoQxWcFakeToken1234567890";

    server {
        listen 443 ssl;
        server_name api.payments.legacy.internal;
        
        ssl_certificate /etc/ssl/certs/wildcard.legacy.internal.pem;
        ssl_certificate_key /etc/ssl/private/wildcard.legacy.internal.key;
        
        # Dummy multi-line RSA key embedded in a location block (for a mock health check)
        location /internal/health {
            set $rsa_key "-----BEGIN RSA PRIVATE KEY-----\
MIIEogIBAAKCAQEAtz7Xq7vGgYl\
... (fake key truncated for brevity) ...\
-----END RSA PRIVATE KEY-----";
            proxy_pass http://legacy_payment_api/health;
        }

        location / {
            # TODO: Add circuit breaker pattern here (urgent)
            proxy_pass http://legacy_payment_api;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_connect_timeout 5s;
            # Commented-out old config from the pre-Consul era
            # proxy_pass http://10.0.42.100:8080;
        }
    }
}

