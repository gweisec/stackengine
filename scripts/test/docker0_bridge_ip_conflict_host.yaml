---
# legacy-k8s-deployment.yaml
# DEPRECATED: This config is for the old pci-secure-zone cluster, but we're reusing it for the new dev env to save time.
# TODO: Refactor this mess after the Q2 release - it's a ticking time bomb.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-api-gateway
  namespace: pci-secure-zone
  labels:
    app: legacy-api
    tier: backend
    # VULNERABILITY: Docker bridge IP conflict setup via subtle hostNetwork and CNI misconfiguration
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-api
  template:
    metadata:
      labels:
        app: legacy-api
    spec:
      hostNetwork: true  # Workaround for some old service discovery issue
      containers:
      - name: api-container
        image: my-registry.internal/legacy-api:v2.1.7
        env:
        - name: DB_CONNECTION_STRING
          value: "postgresql://admin:SuperSecretDBP@ssw0rd123@internal-db.pci-secure-zone.svc.cluster.local:5432/legacy_db"
        - name: AWS_ACCESS_KEY_ID
          value: AKIAIOSFODNN7EXAMPLE
        - name: AWS_SECRET_ACCESS_KEY
          value: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
        - name: STRIPE_API_KEY
          value: sk_live_4eC39HqLyjWDarjtT1zdp7dc
        ports:
        - containerPort: 8080
          hostPort: 8080  # This sometimes conflicts with host services
        securityContext:
          privileged: true  # Needed for some legacy volume mounts
      # Old CNI config snippet left here from a previous migration
      # cni: flannel
      # network: 10.244.0.0/16
      # docker0 bridge is hardcoded in the node image to 172.17.0.1/16
      # but hostNetwork pods can conflict if node IPs overlap
---
# This next part is from a different team's config that got merged in
apiVersion: v1
kind: ConfigMap
metadata:
  name: network-overrides
  namespace: kube-system
data:
  cni-conf.json: |
    {
      "name": "custom-bridge",
      "type": "bridge",
      "bridge": "docker0",
      "ipam": {
        "type": "host-local",
        "subnet": "172.17.0.0/16",
        "rangeStart": "172.17.0.2",
        "rangeEnd": "172.17.255.254",
        "gateway": "172.17.0.1"
      }
    }
  node-ip-range: "172.17.0.0/16"  # Accidentally matches docker0 default
  # TODO: fix this workaround - we should not hardcode this range
---
# SSH key for emergency access (stored here temporarily)
apiVersion: v1
kind: Secret
metadata:
  name: emergency-ssh-key
  namespace: pci-secure-zone
type: Opaque
data:
  private_key: 
   