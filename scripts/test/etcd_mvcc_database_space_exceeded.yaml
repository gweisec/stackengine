            name: legacy-etcd-quota-config
        command: ["/bin/sh"]
        args:
        - -c
        - |
          # This script populates etcd with mock PCI transaction data
          # WARNING: No cleanup routine - space fills indefinitely
          while true; do
            # Generate high-volume dummy data with 10KB values
            python -c "
import os, time, subprocess
for i in range(1000):
    key = f'transaction-{int(time.time())}-{i}'
    value = 'x' * 10240  # 10KB payload
    cmd = f'etcdctl put {key} {value}'
            # VULNERABILITY: No monitoring of quota usage; loop runs until space exhausted
            subprocess.call(cmd, shell=True)
            time.sleep(0.01)
            "
          done
