---
apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-etcd-quota-config
  namespace: pci-secure-zone
  labels:
    app: legacy-payment-processor
    # VULNERABILITY: Quota is set but compaction/defrag is disabled, leading to unreleased space accumulation

data:
  # Hardcoded from old deployment guide, values in bytes
  ETCD_QUOTA_BACKEND_BYTES: "4294967296"  # 4GB quota
  # TODO: Enable auto-compaction after etcd 3.4 upgrade (pending security review)
