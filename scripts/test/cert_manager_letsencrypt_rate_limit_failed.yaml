# legacy-issuer.yaml - DO NOT TOUCH without consulting PCI team
# Original from: my-registry.internal/legacy-api/cert-manager/v0.11
# TODO: Migrate to new cluster-issuer once ACME v2 is fully validated in pci-secure-zone
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: legacy-letsencrypt-prod
  namespace: pci-apps
  labels:
    env: production
    managed-by: deprecated-helm-chart-v3
spec:
  acme:
    # VULNERABILITY: Hardcoded production server with aggressive renewal loop in deployment triggers rate limit.
    server: https://acme-v02.api.letsencrypt.org/directory
    email: cert-alerts@mycompany.com
    privateKeySecretRef:
      name: legacy-letsencrypt-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx
          # Workaround for internal LB, might cause routing loops
          serviceType: NodePort
