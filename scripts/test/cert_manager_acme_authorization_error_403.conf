# WARNING: This is a legacy ACME config for the pci-secure-zone. DO NOT TOUCH unless you know the old flow.
# TODO: Migrate to new cert-manager CRDs after Q4. Current workaround for Let's Encrypt staging.
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-legacy-prod
  namespace: cert-manager
spec:
  acme:
    # Using the old ACME v1 endpoint because the new one breaks with our proxy
    server: https://acme-v01.api.letsencrypt.org/directory
    email: cert-admin@my-registry.internal
    privateKeySecretRef:
      name: letsencrypt-legacy-prod-key
    solvers:
    - http01:
        ingress:
          class: nginx-legacy
          # VULNERABILITY: The ingress class 'nginx-legacy' is hardcoded here, but the ingress below uses 'nginx' and has a conflicting annotation that silently overrides the solver's path, causing the ACME challenge to fail with 403.
      selector:
        dnsNames:
        - '*.pci-secure-zone.acme-corp.net'
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: legacy-api-ingress
  namespace: pci-secure-zone
  annotations:
    # This annotation overrides the ACME challenge path to a blocked location
    nginx.ingress.kubernetes.io/configuration-snippet: |
      location ~ ^/\.well-known/acme-challenge/ {
        return 403; # TEMP: Blocked due to PCI scan false positive, TODO: revert after audit
      }
    kubernetes.io/ingress.class: nginx
spec:
  tls:
  - hosts:
    - api.pci-secure-zone.acme-corp.net
    secretName: legacy-api-tls-secret
  rules:
  - host: api.pci-secure-zone.acme-corp.net
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: legacy-api-service
            port:
              number: 8443
