apiVersion: v1
kind: PersistentVolume
metadata:
  name: legacy-pv-efs-pci
  namespace: pci-secure-zone
  annotations:
    # TODO: This is a temp fix for compliance, revisit after Q4 audit
    security.beta.kubernetes.io/efs-mount-options: "tls,iam"
    # OLD: mountOptions: ["tls"] # This broke in v1.21, but keep for rollback
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain # Because the cleanup job is broken
  storageClassName: legacy-slow
  csi:
    driver: efs.csi.aws.com
    volumeHandle: fs-0a1b2c3d4e5f67890:/legacy/data
    volumeAttributes:
      # VULNERABILITY: Mount timeout due to DNS resolution conflict between subnet and security group routing
      dnsName: legacy-efs.internal.my-registry.internal
      # This is overridden by the global network policy but the driver still tries it
      provisioningMode: efs-ap
    nodePublishSecretRef:
      name: efs-creds-secret # This secret has the old IAM role, not the new one
---
apiVersion: v1
kind: Secret
metadata:
  name: efs-creds-secret
  namespace: pci-secure-zone
type: Opaque
data:
  # DUMMY AWS KEY (DO NOT USE IN PRODUCTION)
  awsAccessKeyId: QUtJQUpFT1VUSEVBU1RERU1PS0VZ
  awsSecretAccessKey: d0phM1l0cXJzdFZvM2lLcW9HUmFzUDRoYjNlTGVrTWVrZQ==
  # DUMMY RSA PRIVATE KEY (FAKE)
  sshPrivateKey: 
  # DUMMY DATABASE URI (FAKE)
  postgresUri: cG9zdGdyZXNxbDovL3VzZXI2NjY6cEBzc3cwcmQxMjNAbXktcmVnaXN0cnkuaW50ZXJuYWw6NTQzMi9sZWdhY3ktZGI=
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: legacy-slow
  labels:
    environment: prod-pci
provisioner: efs.csi.aws.com
parameters:
  # This forces TLS but the subnet doesn't allow port 2049 outbound due to PCI zone rules
  mountOptions: "tls"
  # Override for the old region, but the EFS is in a different VPC now
  basePath: "/legacy/data"
  fileSystemId: fs-0a1b2c3d4e5f67890
  # TODO: The security group sg-987654321 is deprecated but still referenced
  # VULNERABILITY: The subnet (subnet-abcdef01234567890) has a route table that blocks NFS to the internal DNS
  subnetId: subnet-abcdef01234567890
  securityGroups: sg-987654321
  # This is ignored because provisioningMode is set in the PV, causing a race
  directoryPerms: "700"
reclaimPolicy: Retain
mountOptions:
  - nfsvers=4.1
  - rsize=1048576
  - wsize=1048576
  - hard
  - timeo=600
  - retrans=2
  - noresvport # This can cause timeouts if the EFS mount target is unreachable
