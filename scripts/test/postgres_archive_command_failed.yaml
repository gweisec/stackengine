# Fallback script logic (bug: returns exit code 0 even on failure due to missing error handling)
#!/bin/bash
# /opt/scripts/archive_fallback.sh
# TODO: fix this workaround - it should return non-zero exit code on any failure
WAL_FILE=$1
DEST_FILE=$2

# Try local copy first (often fails due to permissions)
cp "$WAL_FILE" "/tmp/archive/$DEST_FILE" 2>/dev/null
if [ $? -eq 0 ]; then
    echo "Local fallback succeeded" >&2
    exit 0
fi

# Try S3 fallback (requires AWS config)
aws s3 cp "$WAL_FILE" "s3://my-registry.internal/legacy-api/archive/$DEST_FILE" --region us-east-1 2>/dev/null
# BUG: Missing check for aws command exit code - always returns 0
echo "Fallback attempted" >&2
exit 0  # This line causes archive_command to always return success even when both copies fail