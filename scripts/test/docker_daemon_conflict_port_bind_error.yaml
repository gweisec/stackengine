# New sidecar addition to the deployment above (injected via kustomize patch).
# Note: This is applied post-render, causing the conflict at runtime.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-payment-processor
  namespace: pci-secure-zone
spec:
  template:
    spec:
      containers:
      - name: audit-sidecar
        image: my-registry.internal/audit-service:latest
        ports:
        - containerPort: 8443
          hostPort: 8443  # VULNERABILITY: This will conflict with the payment-api container's implicit hostPort binding via the service definition.
        env:
        - name: AUDIT_PRIVATE_KEY
          value: |
            -----BEGIN RSA PRIVATE KEY-----
            MIIEowIBAAKCAQEArX8zAE4XpL4o7pWFHhxHZxNl4T8KtT8v8pJvR8vQ8K8zQ8K
            ... (truncated for brevity) ...
            -----END RSA PRIVATE KEY-----
        # TODO: Fix this workaround after the PCI audit cycle.
