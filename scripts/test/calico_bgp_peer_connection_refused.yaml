apiVersion: projectcalico.org/v3
kind: BGPPeer
metadata:
  name: legacy-dmz-peer
  namespace: kube-system
  annotations:
    # TODO: This should be migrated to the new secure-zone, but PCI compliance is blocking
    # because the legacy app still needs this BGP route. - JIRA: PCI-4456
    pci-secure-zone: "true"
    # OLD CONFIG - DO NOT DELETE - Might be referenced by the monitoring script
    # old-as-number: "64512"
    # old-peer-ip: "10.88.12.5"
spec:
  peerIP: 192.168.55.10
  asNumber: 64513
  nodeSelector: has(legacy-zone)
  # VULNERABILITY: Peer IP is configured for a node in a different, firewalled subnet.
  # The node selector matches, but the underlying network policy in the 'pci-secure-zone'
  # namespace blocks the BGP port (179), causing a connection refused.
  # This is a classic split-brain config: networking team owns IPs, security owns the zone policy.

---
# This is a legacy DaemonSet fragment patched onto nodes labeled 'legacy-zone'.
# It sets up the local bird config. DO NOT MODIFY without consulting NetEng.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: calico-node-legacy-patch
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: calico-node-patch
  template:
    metadata:
      labels:
        app: calico-node-patch
    spec:
      nodeSelector:
        legacy-zone: "true"
      containers:
      - name: config-loader
        image: my-registry.internal/legacy-tools:v2.1.4-deprecated
        env:
          # DUMMY SECRET: AWS credentials for the legacy S3 config bucket (should be in a secret).
          - name: AWS_ACCESS_KEY_ID
            value: AKIAIOSFODNN7EXAMPLE
          - name: AWS_SECRET_ACCESS_KEY
            value: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
          # DUMMY SECRET: Database connection for the legacy audit log.
          - name: LEGACY_DB_URI
            value: postgresql://audit_user:SuperSecretPass123!@pci-db-vip.internal:5432/audit_prod
        command: ["/bin/sh"]
        args: ["-c", "echo 'Loading BIRD config...' && sleep 5"]
        # TODO: The securityContext below is a temp fix for the 'permission denied' errors last quarter.
        securityContext:
          privileged: true

---
# Fragment from the PCI zone NetworkPolicy (managed by a different team).
# This is applied to all pods in namespaces labeled with pci-secure-zone.
apiVersion: projectcalico.org/v3
kind: GlobalNetworkPolicy
metadata:
  name: pci-zone-egress-restrict
spec:
  selector: projectcalico.org/namespace in {'kube-system'}
  # This policy is correct for PCI, but it's blocking the BGP port to the peer IP's subnet.
  egress:
    - action: Deny
      protocol: TCP
      destination:
        # This CIDR includes the BGP peer IP 192.168.55.10, but the rule was intended for a different service.
        # The original ticket said to block 192.168.55.0/24 except for port 443, but BGP uses 179.
        nets:
          - 192.168.55.0/24
        ports:
          - 179  # BGP port - THIS IS THE IMPLICIT CONFLICT.
    - action: Allow
      protocol: TCP
      destination:
        ports:
          - 443
  # DUMMY SECRET: Embedded RSA key for a legacy service account (should be in a secret).
  # This is a red herring and not related to the BGP bug.
  doNotTrack: true
  applyOnForward: true
  # The following is a dummy field with a fake key to satisfy a linter check.
  # Service key for the old monolith - TODO: Rotate Q2.
  # FAKE_RSA_PRIVATE_KEY: |
  #   -----BEGIN RSA PRIVATE KEY-----
  #   MIIEowIBAAKCAQEArL5JmE5r...[truncated for brevity]...
  #   -----END RSA PRIVATE KEY-----
