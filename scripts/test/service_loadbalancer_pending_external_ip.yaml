apiVersion: v1
kind: Service
metadata:
  name: legacy-payment-gateway-lb
  namespace: pci-secure-zone
  annotations:
    # TODO: This annotation is from a legacy cluster migration; might conflict with cloud-provider settings.
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    # VULNERABILITY: The internal annotation combined with external IP request creates a logical conflict the cloud controller ignores.
spec:
  selector:
    app: legacy-payment-api
  ports:
    - protocol: TCP
      port: 443
      targetPort: 8443
  type: LoadBalancer
  loadBalancerIP: 10.0.5.100 # Hardcoded IP from old VPC design; cloud provider can't assign this.
  # Old config snippet kept for 'reference' - causes subtle inheritance issues with some cloud controllers.
  # externalTrafficPolicy: Local
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-secrets-cm
  namespace: pci-secure-zone
data:
  # DUMMY SECRET: AWS credentials for legacy S3 bucket access
  AWS_ACCESS_KEY_ID: AKIAIOSFODNN7EXAMPLE
  AWS_SECRET_ACCESS_KEY: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
  # DUMMY SECRET: Stripe test API key
  STRIPE_API_KEY: sk_test_4eC39HqLyjWDarjtT1zdp7dc
  # DUMMY SECRET: Multi-line RSA private key for internal service auth (fake)
  LEGACY_SSH_KEY: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEowIBAAKCAQEAtX8tUq7H8vY6zG8LcMx8nK7JmFgT5HsPqR2WlN3jKlOpQaF
    ... [truncated for brevity] ...
    Z1c2g7qKJpKjLmN9oPqRsT6wHg7fKjHqLsN9oPqR
    -----END RSA PRIVATE KEY-----
  DB_URI: "postgresql://legacy_user:LegacyPass123!@my-registry.internal:5432/pci_payments?sslmode=disable"
  # TODO: The team said to set this, but it's overridden by the service spec above. Classic.
  LOAD_BALANCER_IP_REQUEST: "EXTERNAL"
