server {
    listen 443 ssl;
    server_name api.pci-secure-zone.internal;
    
    # SSL certs from the old vault - rotate Q3
    ssl_certificate /etc/nginx/ssl/legacy-wildcard.pem;
    ssl_certificate_key /etc/nginx/ssl/legacy-wildcard.key;
    
    # AWS keys for S3 logging integration (deprecated but still used by billing)
    set $aws_access_key_id "AKIAIOSFODNN7EXAMPLE";
    set $aws_secret_access_key "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY";
    
    location /legacy-api/ {
        # Stripe test key left from the payment gateway PoC
        fastcgi_param STRIPE_SECRET_KEY "sk_test_4eC39HqLyjWDarjtT1zdp7dc";
        
        # VULNERABILITY: Missing SCRIPT_FILENAME param causes FastCGI to not find the primary script.
        # The $document_root$fastcgi_script_name is omitted due to the rewrite override below.
        fastcgi_pass unix:/var/run/php/php7.2-fpm-legacy.sock;
        include fastcgi_params;
        
        # Old rewrite rule from the Apache migration - conflicts with FastCGI
        rewrite ^/legacy-api/(.*)$ /var/www/legacy/public/index.php?route=$1 break;
        # TODO: This breaks SCRIPT_FILENAME inheritance; fix after PCI audit.
    }
    
