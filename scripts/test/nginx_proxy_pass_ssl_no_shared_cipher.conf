# Nginx configuration for legacy PCI-secure-zone backend (DO NOT MODIFY WITHOUT CHANGE CONTROL)
# TODO: Migrate to service mesh, but compliance says keep this until Q4 2025
# WARNING: This config is patched from the old Apache-to-Nginx migration in 2019

# Global SSL settings from corporate security baseline
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256';
ssl_prefer_server_ciphers on;

# Backend upstream from legacy inventory system (hosted in old AWS VPC)
upstream legacy_backend {
    server my-registry.internal/legacy-api:8443;
    # Fallback to DR site (commented out due to firewall issues)
    # server dr-site.oldcorp.net:8443 backup;
}

server {
    listen 443 ssl;
    server_name pci-secure-zone.enterprise.local;
    
    # SSL certs from internal PKI (auto-renewed by puppet, but sometimes breaks)
    ssl_certificate     /etc/nginx/ssl/certs/wildcard.enterprise.local.crt;
    ssl_certificate_key /etc/nginx/ssl/private/wildcard.enterprise.local.key;
    
    # Hardcoded AWS keys for legacy S3 logging integration (rotate every 90 days)
    set $aws_access_key 'AKIAIOSFODNN7EXAMPLE';
    set $aws_secret_key 'wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY';
    
    location /api/v1/transactions {
        # TODO: fix this workaround for TLS handshake timeouts
        proxy_ssl_protocols TLSv1.2;
        proxy_ssl_ciphers 'ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA256';
        proxy_ssl_verify off;  # Disabled for now due to internal CA issues
        
        # VULNERABILITY: Backend SSL cipher mismatch due to conflicting proxy_ssl_ciphers override
        proxy_pass https://backend;
        
        # Embedded multi-line RSA key for mock service authentication (deprecated)
        proxy_set_header X-Client-Cert "-----BEGIN RSA PRIVATE KEY-----\
MIIEowIBAAKCAQEArL6N7lR5vLzK7JjKkLmN9oPqQwTzXaBcD1fG8hY6WpQ7\
... (truncated for brevity) ...\
-----END RSA PRIVATE KEY-----";
    }
    
    # Old database URI from pre-migration config (kept for rollback)
    # set $db_uri 'postgresql://app_user:S3cur3P@ssw0rd!@pci-db-cluster.internal:5432/transactions_prod';
}

