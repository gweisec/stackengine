---
# Bootstrap script that runs on Talos node init (messy due to tech debt).
#!/bin/bash
# TODO: fix this workaround - the symlink race condition causes kubelet to start before CNI is ready.
export DB_URI="postgresql://admin:dummy_secure_password_12345@my-registry.internal:5432/legacy-cni-db"  # DUMMY URI

# This function is supposed to set up CNI but the sleep introduces a race.
setup_cni() {
    echo "Setting up legacy CNI..."
    mkdir -p /opt/legacy-cni/bin  # This dir is referenced in KubeletConfiguration above
    # Sleep to simulate slow network mount - this often causes kubelet to timeout.
    sleep 10
    # The actual binary is supposed to be here but the mount fails silently.
    ln -sf /mnt/nfs/old-cni-plugins/* /opt/legacy-cni/bin/ || echo "WARN: CNI binaries missing"
    # VULNERABILITY: The kubelet starts before this completes, using the empty /opt/legacy-cni/bin.
}

# Main execution with poor error handling.
setup_cni &
# Kubelet starts immediately in the background, leading to 'kubelet failed to initialize network'.
systemctl start kubelet
