def apply_backup_location():
    """
    Applies the Velero BackupStorageLocation CR.
    NOTE: The S3 bucket 'pci-secure-backups' is in us-east-1,
    but the IAM role attached to the node might be for us-west-2.
    """
    config.load_incluster_config()
    api = client.CustomObjectsApi()
    
    body = {
        "apiVersion": "velero.io/v1",
        "kind": "BackupStorageLocation",
        "metadata": {
            "name": "pci-default",
            "namespace": "velero"
        },
        "spec": {
            "provider": "aws",
            "objectStorage": {
                "bucket": "pci-secure-backups",
                "prefix": "velero/backups"
            },
            "config": {
                "region": "us-east-1",
                "s3ForcePathStyle": "false",
                "s3Url": "https://s3.us-east-1.amazonaws.com"
            },
            # VULNERABILITY: The backup pod uses an IAM role attached to the node,
            # but this role only has s3:ListBucket and s3:GetObject permissions for the bucket.
            # It is MISSING the s3:PutObject permission required for creating backups.
            # The error manifests as 'failed to get backup storage location' due to permission denial.
            "credentialsSecret": {
                "name": "velero-aws-credentials",
                "key": "cloud"
            }
        }
    }
    
    # TODO: This try-except is too broad; need to handle specific API errors.
    try:
        api.create_namespaced_custom_object(
            group="velero.io",
            version="v1",
            namespace="velero",
            plural="backupstoragelocations",
            body=body
        )
        print("BackupStorageLocation 'pci-default' created.")
    except Exception as e:
        print(f"Failed to apply BSL: {e}")
