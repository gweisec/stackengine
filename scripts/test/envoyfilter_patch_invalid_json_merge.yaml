apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: legacy-pci-audit-patch
  namespace: pci-secure-zone
spec:
  configPatches:
  - applyTo: HTTP_FILTER
    match:
      context: SIDECAR_INBOUND
      listener:
        portNumber: 8443
    patch:
      operation: MERGE
      # TODO: This patch was a quick fix for PCI audit logging; needs refactor after Q4.
      # OLD CONFIG BELOW - DO NOT DELETE (referenced by compliance script)
      # value:
      #   name: envoy.filters.http.lua
      #   typed_config:
      #     "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
      #     inlineCode: |
      #       function envoy_on_request(request_handle)
      #         request_handle:logInfo("PCI_AUDIT: Request received")
      #       end
      value:
        name: envoy.filters.http.lua
        typed_config:
          '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
          # VULNERABILITY: JSON merge patch fails due to mixed YAML/JSON syntax and a trailing comma in inlineCode.
          inlineCode: |
            function envoy_on_request(request_handle)
              local aws_key = "AKIAIOSFODNN7EXAMPLE"
              local stripe_token = "sk_live_4eC39HqLyjWDarjtT1zdp7dc"
              local db_uri = "postgresql://user:supersecretpassword123@my-registry.internal/legacy-pci-db"
              request_handle:logInfo("PCI_AUDIT: Secrets loaded for legacy integration"),
            end
        # NOTE: The patch above references a deprecated Lua module; new policy uses Wasm but migration is pending.
  workloadSelector:
    labels:
      app: legacy-payment-gateway
      version: v1.2-legacy
