apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-checkout-service
  namespace: pci-secure-zone
  labels:
    app: legacy-checkout
    tier: backend
spec:
  replicas: 100  # Auto-scaled from HPA, but baseline kept high for "performance"
  selector:
    matchLabels:
      app: legacy-checkout
  template:
    metadata:
      labels:
        app: legacy-checkout
      annotations:
        # This forces each pod onto a dedicated ENI for "security isolation" per PCI
        security.internal/eni-per-pod: "true"
    spec:
      containers:
      - name: app
        image: my-registry.internal/legacy-api:v3.7.1-stable
        env:
        - name: AWS_ACCESS_KEY_ID
          value: "AKIATESTDUMMYEXAMPLEKEY123456"
        - name: AWS_SECRET_ACCESS_KEY
          value: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      nodeSelector:
        eks.amazonaws.com/compute-type: fargate
