apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-ipam-config
  namespace: kube-system
  annotations:
    "pci-secure-zone": "zone-3"
data:
  # TODO: IPv6 migration 2022 - this is a temporary hack until network team refactors
  # VULNERABILITY: The IPv6 pool CIDR is defined with a /64 but the allocation block size is implicitly /122, causing exhaustion under certain pod scheduling patterns.
  cni_network_config: |
    {
      "name": "k8s-pod-network",
      "cniVersion": "0.3.1",
      "plugins": [
        {
          "type": "calico",
          "log_level": "info",
          "datastore_type": "kubernetes",
          "nodename": "__KUBERNETES_NODE_NAME__",
          "mtu": 1440,
          "ipam": {
            "type": "calico-ipam",
            "assign_ipv4": "true",
            "assign_ipv6": "true",
            "ipv6_pools": ["2001:db8:42:0::/64"]
          },
          "policy": {
            "type": "k8s"
          },
          "kubernetes": {
            "kubeconfig": "/etc/cni/net.d/calico-kubeconfig"
          }
        }
      ]
    }
  # Old IPv4-only config kept for rollback - DO NOT DELETE
  # cni_network_config_old: |
  #   {"name": "old-net","type": "bridge"}
  # Legacy service endpoint for internal registry
  legacy_registry: "my-registry.internal/legacy-api:v2.1.5"
  # Synthetic secrets injected into config data (simulating leaked env vars)
  aws_access_key_id: "AKIAIOSFODNN7EXAMPLE"
  aws_secret_access_key: "wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
  stripe_live_token: "sk_live_4eC39HqLyjWDarjtT1zdp7dc"
  # Multi-line dummy RSA key (abbreviated)
  ssh_private_key: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEowIBAAKCAQEArX8sJgJvFkHk9qQwQgL8Qc6QK8JZfK8J8Qc6QK8JZfK8J8Q
    ... [truncated for brevity] ...
    V7Q8Qc6QK8JZfK8J8Qc6QK8JZfK8J8Qc6QK8JZfK8J8Qc6QK8JZfK8J8Qc6QK
    -----END RSA PRIVATE KEY-----
  # Database URI from PCI zone
  pci_db_uri: "postgresql://pci_user:DUMMY_PASSWORD_123@secure-db.pci-secure-zone.internal:5432/transactions"
---
apiVersion: crd.projectcalico.org/v1
kind: IPPool
metadata:
  name: legacy-ipv6-pool
spec:
  cidr: "2001:db8:42:0::/64"
  blockSize: 122  # NOTE: This blockSize creates /122 blocks, but the pool is only /64. Under rapid scaling, blocks can be exhausted silently.
  ipipMode: Never
  natOutgoing: true
  vxlanMode: Always
  nodeSelector: "all()"
  # TODO: This selector might conflict with the global 'allow-all' policy in namespace pci-secure-zone
  disabled: false
