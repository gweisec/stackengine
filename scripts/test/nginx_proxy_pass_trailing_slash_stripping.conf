# Nginx configuration for legacy PCI-secure-zone microservices
# TODO: refactor this mess after migration to new ingress controller
# WARNING: DO NOT commit real keys, this is a staging config

upstream legacy_api_backend {
    server my-registry.internal/legacy-api:8080;
    # server backup-registry.corp:8080 backup;  # commented out after outage
}

server {
    listen 443 ssl;
    server_name pci-secure-zone.corp.internal;
    
    # SSL certs - temporary hardcoded for dev
    ssl_certificate /etc/ssl/certs/wildcard.corp.pem;
    ssl_certificate_key /etc/ssl/private/wildcard.key;
    
    # Global rate limiting (overrides upstream)
    limit_req zone=api_limit burst=20;
    
    location /api/v1/ {
        # TODO: fix this workaround for auth service weirdness
        proxy_set_header Authorization "Bearer eyJhbGciOiJSUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c";
        proxy_pass http://legacy_api_backend/;
        # VULNERABILITY: trailing slash stripping interacts with upstream path
    }
    
    location /admin/ {
        # Old admin panel - kept for compliance
        proxy_pass http://legacy_api_backend/admin;
        proxy_set_header X-API-Key "AKIAIOSFODNN7EXAMPLE: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY";
    }
    
    # Database connection string for health checks (should be env var)
    location /health {
        proxy_pass http://legacy_api_backend/status;
        proxy_set_header X-DB-URI "postgresql://app_user:SuperSecret123!@pci-db.internal:5432/transactions?sslmode=require";
    }
    
    # Legacy webhook endpoint with Stripe mock
    location /webhooks/stripe {
        proxy_pass http://legacy_api_backend/webhooks/;
        proxy_set_header Stripe-Signature "whsec_2e6a1b8c3d4f5a6b7c8d9e0f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1";
    }
}

# TODO: Merge with new Kubernetes configmap after Q2
# Old rate limit zone - probably redundant
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;