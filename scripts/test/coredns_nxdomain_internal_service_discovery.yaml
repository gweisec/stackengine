# TODO: This config is a mess after the merger with legacy-ops-team. Need to refactor.
# Old service discovery endpoint - DO NOT DELETE (PCI compliance audit requires history)
# api-endpoint: http://my-registry.internal/legacy-api/v1/discover

apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
  annotations:
    owner: pci-secure-zone-ops@example.com
    # VULNERABILITY: The rewrite plugin here blindly redirects all .cluster.local to an external, potentially non-existent resolver for 'internal' zones, causing NXDOMAIN cascades for internal service discovery.
data:
  Corefile: |
    .:53 {
        errors
        health
        # TODO: The kubernetes plugin below is disabled for 'pci-secure-zone' but rewrite overrides it. Fix after Q4.
        kubernetes cluster.local in-addr.arpa ip6.arpa {
          pods insecure
          fallthrough in-addr.arpa ip6.arpa
        }
        # Workaround for legacy on-prem DNS - this breaks internal discovery
        rewrite name regex (.*)\.cluster\.local my-registry.internal/legacy-api
        prometheus :9153
        forward . /etc/resolv.conf
        cache 30
    }
  # DUMMY SECRET: AWS credentials for dev (rotate quarterly)
  aws-creds: |
